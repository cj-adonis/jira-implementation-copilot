<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#f5f7fb"/>
    <meta name="description" content="A local workspace for Jira MX issues, comments, boards, and sprints."/>
    <title>Jira MX Workspace</title>
    <script>
      (() => {
        let theme = 'system';
        try { theme = localStorage.getItem('jira-copilot-theme') || 'system'; } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#111827' : '#f5f7fb';
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
